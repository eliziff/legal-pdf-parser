[package]
name = "legal-pdf-constituents"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The constituent documents a PDF holds: exhibits, schedules, the messages an email quotes"

[dependencies]
legal-pdf-core = { path = "../legal-pdf-core" }
legal-pdf-structure-model = { path = "../legal-pdf-structure-model" }
legal-pdf-text = { path = "../legal-pdf-text" }
legal-pdf-headings = { path = "../legal-pdf-headings" }
legal-structure-model = { workspace = true }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
