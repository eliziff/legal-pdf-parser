[package]
name = "legal-pdf-extraction-processor"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
legal-pdf-core = { path = "../legal-pdf-core" }
lopdf = { version = "0.42.0", default-features = false, features = ["rayon"] }
pdf-inspector-core = { path = "../vendor/pdf-inspector/crates/core" }
pdf-inspector-detector = { path = "../vendor/pdf-inspector/crates/detector" }
pdf-inspector-loader = { path = "../vendor/pdf-inspector/crates/loader" }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
