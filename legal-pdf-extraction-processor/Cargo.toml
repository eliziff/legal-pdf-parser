[package]
name = "legal-pdf-extraction-processor"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
legal-pdf-core = { path = "../legal-pdf-core" }
lopdf = { version = "0.42.0", default-features = false, features = ["rayon"] }
pdf-inspector = { workspace = true }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
