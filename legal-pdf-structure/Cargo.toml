[package]
name = "legal-pdf-structure"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The PDF structure stage's orchestrator: each stage's crate called in order, what the first read cached"

[dependencies]
legal-pdf-core = { path = "../legal-pdf-core" }
legal-pdf-structure-model = { path = "../legal-pdf-structure-model" }
legal-pdf-layout = { path = "../legal-pdf-layout" }
legal-pdf-text = { path = "../legal-pdf-text" }
legal-pdf-headings = { path = "../legal-pdf-headings" }
legal-pdf-notes = { path = "../legal-pdf-notes" }
legal-pdf-graph = { path = "../legal-pdf-graph" }
legal-pdf-diagnostics = { path = "../legal-pdf-diagnostics" }
legal-pdf-decide = { path = "../legal-pdf-decide" }
legal-pdf-evidence = { path = "../legal-pdf-evidence" }
legal-pdf-fences = { path = "../legal-pdf-fences" }
legal-pdf-runs = { path = "../legal-pdf-runs" }
legal-pdf-machine = { path = "../legal-pdf-machine" }
legal-pdf-emit = { path = "../legal-pdf-emit" }
legal-pdf-tier0 = { path = "../legal-pdf-tier0" }
legal-pdf-transition = { path = "../legal-pdf-transition" }
legal-structure-model = { workspace = true }
serde = { version = "1.0", features = ["derive"] }

[features]
# Tier 1's and tier 2's document encoder, and Detect-Order-Construct's stages, run in the engine (legal-pdf-transition).
encoder = ["legal-pdf-transition/encoder"]

# Unit tests run the structure engine, which programs supply at run time.
[dev-dependencies]
legal-pdf-core = { path = "../legal-pdf-core", features = ["structure-analysis"] }
