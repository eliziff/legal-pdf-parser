[package]
name = "legal-pdf-structure"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The PDF structure stage: evidence, fences, runs, notes, tier 0's decision, tier 1 over it, and the structure graph"

[dependencies]
legal-pdf-core = { path = "../legal-pdf-core" }
legal-pdf-structure-model = { path = "../legal-pdf-structure-model" }
legal-pdf-rules = { path = "../legal-pdf-rules" }
legal-pdf-furniture = { path = "../legal-pdf-furniture" }
legal-pdf-graph = { path = "../legal-pdf-graph" }
legal-pdf-notes = { path = "../legal-pdf-notes" }
legal-pdf-evidence = { path = "../legal-pdf-evidence" }
legal-pdf-fences = { path = "../legal-pdf-fences" }
legal-pdf-decide = { path = "../legal-pdf-decide" }
legal-pdf-machine = { path = "../legal-pdf-machine" }
legal-pdf-doc = { path = "../legal-pdf-doc" }
legal-pdf-runs = { path = "../legal-pdf-runs" }
legal-pdf-pages = { path = "../legal-pdf-pages" }
legal-structure-model = { workspace = true }
legal-structure = { workspace = true, default-features = false, features = ["structure-inference"] }
pdf-inspector = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
# A parse kept in the dump (`doc::Entry`'s `parse`), read back whole.
rmp-serde = "1.3"
# The DOC reader's text model (doc/reader.rs): Hugging Face's tokenizer, its regular expressions in Rust.

[features]
# Tier 1's and tier 2's document encoder, and Detect-Order-Construct's stages (`doc`).
encoder = ["legal-pdf-core/ort-runtime", "legal-pdf-doc/encoder"]

# Unit tests run the structure engine, which programs supply at run time.
[dev-dependencies]
legal-pdf-core = { path = "../legal-pdf-core" }
