[package]
name = "legal-pdf-runs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Each reading context's numbering runs, read and resolved by the engine, once the pages are measured and fenced"

[dependencies]
legal-pdf-core = { path = "../legal-pdf-core" }
legal-pdf-structure-model = { path = "../legal-pdf-structure-model" }
legal-pdf-text = { path = "../legal-pdf-text" }
legal-pdf-layout = { path = "../legal-pdf-layout" }
legal-pdf-headings = { path = "../legal-pdf-headings" }
legal-pdf-tables = { path = "../legal-pdf-tables" }
legal-structure-model = { workspace = true }
pdf-inspector = { workspace = true }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
legal-pdf-notes = { path = "../legal-pdf-notes" }
legal-pdf-furniture = { path = "../legal-pdf-furniture" }
legal-pdf-evidence = { path = "../legal-pdf-evidence" }
legal-pdf-constituents = { path = "../legal-pdf-constituents" }
legal-pdf-fences = { path = "../legal-pdf-fences" }
