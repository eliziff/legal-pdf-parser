[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-pdf-parser"
version = "0.1.0"
description = "Local-first structural parsing and exact footnote lookup for legal PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24"]

[project.optional-dependencies]
benchmark = ["rapidfuzz>=3.0", "psutil>=5.9"]
raster = ["numpy>=1.26"]

[project.scripts]
legalpdf = "legalpdf.cli:main"
legalpdf-benchmark = "legalpdf.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legalpdf = ["data/*.json", "tools/*.ps1"]
