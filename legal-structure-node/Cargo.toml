[package]
name = "legal-structure-node"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
legal-structure = { path = "../legal-structure", features = ["a2aj", "journal"] }
legalpdf = { package = "legal-pdf-parser", path = "..", features = ["full"] }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[build-dependencies]
napi-build = "2"
