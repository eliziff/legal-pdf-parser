[package]
name = "legal-pdf-furniture"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The PDF structure stage's a page's furniture: running heads, folios, page labels: on its contract, its rules and the stages it reads"

[dependencies]
legal-pdf-core = { path = "../legal-pdf-core" }
legal-pdf-structure-model = { path = "../legal-pdf-structure-model" }
legal-pdf-rules = { path = "../legal-pdf-rules" }
legal-pdf-pages = { path = "../legal-pdf-pages" }
legal-structure-lines = { workspace = true }
pdf-inspector = { workspace = true }
regex = "1.11"
legal-pdf-layout = { path = "../legal-pdf-layout" }

[dev-dependencies]
legal-citations = { path = "../../common-law-cite/crates/legal-citations" }
legal-citations-data = { path = "../../common-law-cite/crates/legal-citations-data" }
