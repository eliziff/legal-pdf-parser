[package]
name = "legal-pdf-pairing"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
legal-pdf-core = { path = "../legal-pdf-core" }
legal-pdf-support = { path = "../legal-pdf-support" }
legal-structure-model = { workspace = true }
regex = "1.11"
serde_json = "1.0"

# Unit tests run the structure engine, which programs supply at run time.
[dev-dependencies]
legal-pdf-core = { path = "../legal-pdf-core", features = ["structure-analysis"] }
