[package]
name = "legal-pdf-support"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
ppdoc = ["dep:image", "dep:libloading", "legal-pdf-core/render"]
# TypeScript declarations of the types the engine hands JavaScript (the engine's export-types), never a runtime build.
binding-types = ["dep:ts-rs", "legal-pdf-core/binding-types", "legal-structure-model/binding-types"]

[dependencies]
legal-pdf-core = { path = "../legal-pdf-core" }
legal-structure-model = { workspace = true }
legal-locator = { workspace = true }
legal-document-query = { workspace = true }
pdf-inspector = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
libloading = { version = "0.8", optional = true }
regex = "1.11"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-normalization = "0.1"
ts-rs = { version = "12", optional = true, features = ["serde-json-impl"] }

# Unit tests run the structure engine, which programs supply at run time.
[dev-dependencies]
legal-pdf-core = { path = "../legal-pdf-core", features = ["structure-analysis"] }
