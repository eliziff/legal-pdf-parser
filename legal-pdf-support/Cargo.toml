[package]
name = "legal-pdf-support"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
profiling = ["legal-pdf-core/profiling"]
allocation-profiling = ["profiling", "legal-pdf-core/allocation-profiling"]
ppdoc-openvino = ["dep:hayro", "dep:image", "dep:libloading"]
ppdoc = ["ppdoc-openvino", "dep:ort", "legal-pdf-core/ort-runtime"]

[dependencies]
legal-pdf-core = { path = "../legal-pdf-core" }
legal-structure = { path = "../../legal-structure" }
hayro = { version = "0.7.0", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
libloading = { version = "0.8", optional = true }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"], optional = true }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-normalization = "0.1"
