[package]
name = "legal-pdf-parser"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast local-first structural parsing for legal PDFs"

[workspace]
members = ["legal-pdf-*"]
exclude = ["vendor/pdf-inspector", "vendor/diff-match-patch-rs"]
default-members = ["."]
resolver = "2"

# First-party dependencies are the independent main checkouts beside this repository.
[workspace.dependencies]
legal-structure = { path = "../legal-structure", default-features = false }
legal-layout = { path = "../legal-structure/layout" }
legal-structure-model = { path = "../legal-structure/model" }
legal-structure-lines = { path = "../legal-structure/lines" }
legal-locator = { path = "../legal-structure/locator" }
legal-document-query = { path = "../legal-structure/query" }
legal-structure-features = { path = "../legal-structure/features" }
pdf-inspector = { path = "vendor/pdf-inspector", default-features = false }

[features]
default = []
pdf-lite = ["dep:legal-pdf-pages", "dep:legal-pdf-core", "dep:legal-pdf-extraction-processor", "dep:legal-pdf-structure", "dep:legal-pdf-support", "dep:serde", "dep:serde_json", "dep:sha2"]
pdf = ["pdf-lite", "legal-structure/default"]
ocr = ["pdf", "dep:legal-pdf-ocr"]
indra = ["ocr"]
fast-allocator = ["dep:mimalloc"]
ppdoc = ["pdf", "legal-pdf-support/ppdoc"]
# DOC, the structure stage's tier 1: pure-Rust heads over tier 0's reading.
doc = ["pdf", "legal-pdf-structure/encoder"]
full = ["indra", "ppdoc", "doc"]
# TypeScript declarations of the types the engine hands JavaScript (the engine's export-types), never a runtime build.
binding-types = ["legal-pdf-core?/binding-types", "legal-pdf-support?/binding-types", "legal-pdf-extraction-processor?/binding-types", "legal-pdf-pages?/binding-types"]
# The command-line tools, which run this checkout's structure engine.
cli = ["pdf", "dep:legal-citations-data", "dep:legal-citations"]

[lib]
name = "legalpdf"
path = "rust/src/lib.rs"

[[bin]]
name = "legalpdf"
path = "rust/src/main.rs"
required-features = ["cli"]

[dependencies]
legal-pdf-core = { path = "legal-pdf-core", optional = true }
legal-pdf-extraction-processor = { path = "legal-pdf-extraction-processor", optional = true }
legal-pdf-ocr = { path = "legal-pdf-ocr", optional = true }
# For the command-line tools only (the `cli` feature): the engine never links it through this crate.
legal-citations-data = { path = "../common-law-cite/crates/legal-citations-data", optional = true }
legal-citations = { path = "../common-law-cite/crates/legal-citations", optional = true }
legal-pdf-structure = { path = "legal-pdf-structure", default-features = false, optional = true }
legal-pdf-support = { path = "legal-pdf-support", optional = true }
legal-pdf-pages = { path = "legal-pdf-pages", optional = true }
legal-structure = { workspace = true }
legal-structure-model = { workspace = true }
legal-document-query = { workspace = true }
mimalloc = { version = "0.1.52", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.11", optional = true }

[dev-dependencies]
legal-pdf-core = { path = "legal-pdf-core" }
lopdf = { version = "0.45.0", default-features = false }

[patch.crates-io]
hayro-jpeg2000 = { git = "https://github.com/LaurenzV/hayro.git", rev = "ff7e2e407f6b9c429b44dc29a851180727892b6c" }

[profile.dev]
debug = 0
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
incremental = false
strip = true

[profile.profiling]
inherits = "release"
debug = 1
strip = false
