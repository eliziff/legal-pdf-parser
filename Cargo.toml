[package]
name = "legal-pdf-parser"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast local-first structural parsing for legal PDFs"

[workspace]
members = ["legal-pdf-*"]
default-members = ["."]
resolver = "2"

[workspace.dependencies]
legal-structure = { path = "../legal-structure" }
legal-structure-model = { path = "../legal-structure/model" }
pdf-inspector = { git = "https://github.com/eliziff/legal-pdf-parser.git", rev = "b2f3585def52d953bb41bfe19638ec35d090b0ee", default-features = false }

[features]
default = []
pdf = ["dep:legal-pdf-core", "dep:legal-pdf-extraction", "dep:legal-pdf-structure", "dep:legal-pdf-support", "dep:serde", "dep:serde_json", "dep:sha2"]
language = ["dep:legal-pdf-language"]
ocr = ["pdf", "dep:legal-pdf-ocr", "legal-pdf-ocr/ocr"]
kraken = ["ocr", "legal-pdf-ocr/kraken"]
fast-allocator = ["dep:mimalloc"]
profiling = ["pdf", "legal-pdf-support/profiling"]
allocation-profiling = ["profiling", "legal-pdf-support/allocation-profiling"]
ppdoc-openvino = ["pdf", "legal-pdf-support/ppdoc-openvino"]
ppdoc-full = ["pdf", "legal-pdf-support/ppdoc"]
full = ["language", "kraken", "ppdoc-full"]
# The command-line tools, which run this checkout's structure engine.
cli = ["pdf", "legal-pdf-core/structure-analysis"]

[lib]
name = "legalpdf"
path = "rust/src/lib.rs"

[[bin]]
name = "legalpdf"
path = "rust/src/main.rs"
required-features = ["cli"]

[[bin]]
name = "legalpdf-corpus-check"
path = "rust/src/bin/legalpdf-corpus-check.rs"
required-features = ["cli"]

[dependencies]
legal-pdf-core = { path = "legal-pdf-core", optional = true }
legal-pdf-extraction = { path = "legal-pdf-extraction", optional = true }
legal-pdf-language = { path = "legal-pdf-language", optional = true }
legal-pdf-ocr = { path = "legal-pdf-ocr", optional = true }
legal-pdf-structure = { path = "legal-pdf-structure", optional = true }
legal-pdf-support = { path = "legal-pdf-support", optional = true }
legal-structure-model = { workspace = true }
mimalloc = { version = "0.1.52", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
# Unit tests run the structure engine, which programs supply at run time.
legal-pdf-core = { path = "legal-pdf-core", features = ["structure-analysis"] }
lopdf = { version = "0.45.0", default-features = false }

[build-dependencies]
sha2 = "0.10"

[patch.crates-io]
hayro-jpeg2000 = { git = "https://github.com/LaurenzV/hayro.git", rev = "ff7e2e407f6b9c429b44dc29a851180727892b6c" }

[profile.dev]
debug = 0
incremental = true

[profile.release]
codegen-units = 16
incremental = false
strip = true

[profile.profiling]
inherits = "release"
debug = 1
strip = false
