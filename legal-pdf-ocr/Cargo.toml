[package]
name = "legal-pdf-ocr"
version = "0.1.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[features]
default = []
ocr = ["dep:hayro"]
kraken = ["ocr", "dep:cc", "dep:image", "dep:libloading", "dep:ort", "legal-pdf-core/ort-runtime"]

[dependencies]
legal-pdf-core = { path = "../legal-pdf-core" }
hayro = { version = "0.7.0", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
libloading = { version = "0.8", optional = true }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[build-dependencies]
cc = { version = "1", optional = true }
