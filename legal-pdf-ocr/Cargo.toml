[package]
name = "legal-pdf-ocr"
version = "0.1.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[[bin]]
name = "legalocr"
path = "src/bin/legalocr.rs"

[features]
default = []
# Intermediate witnesses for the structural-mark experiment; absent from ordinary builds.
attribution = ["dep:sha2"]

[dependencies]
legal-pdf-core = { path = "../legal-pdf-core", features = ["ort-runtime", "render"] }
legal-pdf-pages = { path = "../legal-pdf-pages" }
image = { version = "0.25", default-features = false, features = ["png"] }
mimalloc = { version = "0.1.52", default-features = false }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", optional = true }

[build-dependencies]
cc = "1"
