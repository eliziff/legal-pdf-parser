[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalpdf-ppdoc-lite-runtime"
version = "0.1.0"
description = "Standalone local layout inference for the Legal PDF Parser"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
runtime-cpu = ["onnxruntime>=1.20"]
runtime-cuda = ["onnxruntime-gpu>=1.20"]
runtime-directml = ["onnxruntime-directml>=1.20; platform_system == 'Windows'"]
images-pillow = ["Pillow>=10"]
images-opencv = ["opencv-python-headless>=4.9"]
test = ["opencv-python-headless>=4.9", "pytest>=8"]

[project.scripts]
ppdoc-lite = "ppdoc_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
