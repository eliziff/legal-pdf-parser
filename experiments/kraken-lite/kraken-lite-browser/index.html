<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kraken Lite Browser OCR</title>
  <style>
    :root{color-scheme:light dark;font:16px/1.45 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:Canvas;color:CanvasText}main{width:min(76rem,calc(100% - 2rem));margin:2rem auto}h1{margin:0 0 .25rem;font-size:clamp(1.5rem,4vw,2.25rem)}p{margin:.25rem 0;color:color-mix(in srgb,CanvasText 68%,transparent)}form,.toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:.75rem;margin:1.5rem 0}label{display:grid;gap:.35rem;font-weight:650}input,select,button{min-height:2.75rem;font:inherit}input,select{max-width:100%;padding:.55rem;border:1px solid color-mix(in srgb,CanvasText 28%,transparent);border-radius:.6rem;background:Field;color:FieldText}button{padding:.6rem .9rem;border:0;border-radius:.6rem;background:#b42318;color:#fff;font-weight:700;cursor:pointer}button.secondary{border:1px solid color-mix(in srgb,CanvasText 28%,transparent);background:ButtonFace;color:ButtonText}button:disabled{opacity:.55;cursor:wait}:focus-visible{outline:3px solid Highlight;outline-offset:3px}#status{min-height:1.5rem;font-variant-numeric:tabular-nums}.workspace{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:1.5rem;margin-top:1rem}.page{position:relative;width:fit-content;max-width:100%;margin:auto}.page canvas:first-child{display:block;max-width:100%;max-height:72vh;outline:1px solid oklch(0 0 0/.1)}#overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.output{height:72vh;overflow:auto;padding:1rem;border:1px solid color-mix(in srgb,CanvasText 22%,transparent);border-radius:.6rem;background:Field}.output pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:.95rem/1.55 ui-monospace,monospace}.document{display:grid;gap:2rem;margin-top:2rem}.pair{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:1.5rem;min-height:65vh}.pair img{width:100%;height:65vh;object-fit:contain}.pair .text{height:65vh;overflow:auto;padding:1rem;border:1px solid color-mix(in srgb,CanvasText 22%,transparent);border-radius:.6rem;background:Field}.pair pre{white-space:pre-wrap;margin:0} @media(max-width:48rem){.workspace,.pair{grid-template-columns:1fr}.output,.pair .text,.pair img{height:52vh}}
    .modes{flex:1 1 32rem;min-inline-size:min(100%,32rem);margin:0;padding:0;border:0}.modes legend{font-weight:650;margin-block-end:.35rem}.mode-grid{display:grid;grid-template-columns:repeat(4,minmax(7rem,1fr));gap:.5rem}.mode{position:relative;display:grid;gap:.1rem;min-height:3.75rem;padding:.55rem .7rem;border:1px solid color-mix(in srgb,CanvasText 24%,transparent);border-radius:.65rem;background:Field;font-weight:700;cursor:pointer}.mode small{font-weight:400;color:color-mix(in srgb,CanvasText 68%,transparent)}.mode input{position:absolute;inline-size:1px;block-size:1px;opacity:0}.mode:has(input:checked){border-color:Highlight;box-shadow:inset 0 0 0 1px Highlight}.mode:has(input:focus-visible){outline:3px solid Highlight;outline-offset:3px}@media(max-width:52rem){.mode-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:24rem){.mode-grid{grid-template-columns:1fr}}
    .mode-grid{grid-template-columns:repeat(4,minmax(7rem,1fr))}
  </style>
</head>
<body><main>
  <h1>Kraken Lite Browser OCR</h1>
  <p>PDF rendering and OCR run locally in this browser.</p>
  <form id="form">
    <label>PNG or PDF<input id="file" type="file" accept="image/png,application/pdf,.png,.pdf" required></label>
    <label>Page layout<select id="segmentation"><option value="tesseract">Tesseract layout</option><option value="fast">Fast projection</option><option value="none">No segmentation</option></select></label>
    <fieldset class="modes"><legend>Recognition</legend><div class="mode-grid">
      <label class="mode"><input type="radio" name="mode" value="1" checked>Quality<small>Full width</small></label>
      <label class="mode"><input type="radio" name="mode" value=".85">Balanced<small>Reduced width</small></label>
      <label class="mode"><input type="radio" name="mode" value=".76">Turbo<small>Faster, modest drift</small></label>
      <label class="mode"><input type="radio" name="mode" value=".7">Extreme<small>Fastest reliable</small></label>
    </div></fieldset>
    <button id="ocr" type="submit" disabled>Recognize selection</button>
    <button id="all" type="button" class="secondary" disabled>Recognize document</button>
    <button id="clear" type="button" class="secondary">Clear crop</button>
  </form>
  <div class="toolbar"><button id="prev" class="secondary" type="button" disabled>Previous page</button><span id="page-label">Page 1</span><button id="next" class="secondary" type="button" disabled>Next page</button></div>
  <p id="status" role="status" aria-live="polite">Loading recognition model…</p>
  <div class="workspace"><div class="page"><canvas id="page"></canvas><canvas id="overlay"></canvas></div><section class="output"><pre id="text">Select a file.</pre></section></div>
  <section id="document" class="document"></section>
</main><script type="module" src="./dist/app.js"></script></body>
</html>
