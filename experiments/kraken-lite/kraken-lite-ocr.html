<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kraken Lite OCR</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.45 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    main { width: min(70rem, calc(100% - 2rem)); margin: 3rem auto; }
    h1 { margin: 0 0 .35rem; font-size: clamp(1.6rem, 4vw, 2.4rem); }
    p { margin: 0; color: color-mix(in srgb, CanvasText 68%, transparent); }
    form { display: flex; flex-wrap: wrap; align-items: end; gap: .75rem; margin: 2rem 0; }
    label { display: grid; gap: .4rem; font-weight: 650; }
    select { min-height: 2.75rem; padding-inline: .65rem 2rem; border: 1px solid color-mix(in srgb, CanvasText 28%, transparent); border-radius: .6rem; background: Field; color: FieldText; font: inherit; }
    input, button { min-height: 2.75rem; font: inherit; }
    input[type=file] { max-width: 100%; padding: .55rem; border: 1px solid color-mix(in srgb, CanvasText 28%, transparent); border-radius: .6rem; }
    button { padding: .65rem 1rem; border: 0; border-radius: .6rem; background: #b42318; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    button:active { scale: .96; }
    :focus-visible { outline: 3px solid Highlight; outline-offset: 3px; }
    #status { min-height: 1.5rem; margin-block: 1rem; font-variant-numeric: tabular-nums; }
    .results { display: grid; gap: 2rem; }
    section { min-width: 0; }
    h2 { margin: 0 0 .65rem; font-size: 1rem; }
    .preview-shell { position: relative; width: fit-content; max-width: 100%; margin: auto; }
    img, object { display: block; max-width: 100%; max-height: 70vh; margin: auto; object-fit: contain; outline: 1px solid oklch(0 0 0 / .1); border-radius: .4rem; }
    object { height: 70vh; background: white; }
    #selection { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
    .result-head { margin-block-end: .65rem; }
    .result-head h2 { margin: 0; }
    #pages { display: grid; gap: 2rem; }
    .ocr-page { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 1.5rem; min-height: 70vh; padding-block: 1rem 2rem; }
    .page-visual, .page-copy { min-width: 0; height: 70vh; }
    .page-visual object, .page-visual img { width: 100%; height: 100%; object-fit: contain; }
    .page-copy { overflow: auto; overscroll-behavior: contain; padding: 1rem; border: 1px solid color-mix(in srgb, CanvasText 22%, transparent); border-radius: .6rem; background: Field; color: FieldText; }
    .ocr-page h3 { margin: 0 0 1rem; font-size: .9rem; color: color-mix(in srgb, CanvasText 65%, transparent); }
    .ocr-page pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: .95rem/1.55 ui-monospace, monospace; }
    [hidden] { display: none !important; }
    @media (max-width: 48rem) { main { margin-block: 1.5rem; } .ocr-page { grid-template-columns: 1fr; } .page-visual, .page-copy { height: 55vh; } }
    @media (forced-colors: active) { button { border: 1px solid ButtonText; } }
    .modes { flex: 1 1 34rem; min-inline-size: min(100%, 34rem); margin: 0; padding: 0; border: 0; }
    .modes legend { margin-block-end: .4rem; font-weight: 650; }
    .mode-grid { display: grid; grid-template-columns: repeat(4, minmax(7rem, 1fr)); gap: .5rem; }
    .mode { position: relative; min-height: 3.75rem; padding: .55rem .7rem; border: 1px solid color-mix(in srgb, CanvasText 24%, transparent); border-radius: .65rem; background: Field; cursor: pointer; }
    .mode small { font-weight: 400; color: color-mix(in srgb, CanvasText 68%, transparent); }
    .mode input { position: absolute; inline-size: 1px; block-size: 1px; opacity: 0; }
    .mode:has(input:checked) { border-color: Highlight; box-shadow: inset 0 0 0 1px Highlight; }
    .mode:has(input:focus-visible) { outline: 3px solid Highlight; outline-offset: 3px; }
    .geometry { display: flex; align-items: center; min-height: 2.75rem; }
    .geometry input { min-height: auto; }
    @media (max-width: 52rem) { .mode-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 24rem) { .mode-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Kraken Lite OCR</h1>
    <p>Local OCR for PNG and PDF files.</p>

    <form id="form">
      <label for="image">PNG or PDF
        <input id="image" name="image" type="file" accept="image/png,application/pdf,.png,.pdf" required>
      </label>
      <fieldset class="modes"><legend>Recognition</legend><div class="mode-grid">
          <label class="mode"><input type="radio" name="mode" value="quality">Quality<small>Tesseract layout + big INT8</small></label>
          <label class="mode"><input type="radio" name="mode" value="balanced" checked>Balanced<small>Faster than Tesseract</small></label>
          <label class="mode"><input type="radio" name="mode" value="fast">Fast<small>Small 0.85</small></label>
          <label class="mode"><input type="radio" name="mode" value="turbo">Turbo<small>Small 0.70</small></label>
      </div></fieldset>
      <label class="geometry"><input id="geometry" type="checkbox"> Full BLLA segmentation</label>
      <button id="run" type="submit">Recognize page</button>
    </form>

    <p id="status" role="status" aria-live="polite">Choose a PNG to begin.</p>

    <div class="results">
      <section id="source-section">
        <h2>Page</h2>
        <div class="preview-shell">
          <img id="preview" alt="Selected page preview" hidden>
          <canvas id="selection" aria-label="Drag to select a recognition region" hidden></canvas>
          <object id="pdf" type="application/pdf" aria-label="Selected PDF preview" hidden></object>
        </div>
      </section>
      <section>
        <div class="result-head">
          <h2>Recognized text</h2>
        </div>
        <div id="pages" aria-live="polite">OCR output will appear here.</div>
      </section>
    </div>
  </main>

  <script>
    const form = document.querySelector('#form');
    const input = document.querySelector('#image');
    const button = document.querySelector('#run');
    const geometry = document.querySelector('#geometry');
    const preview = document.querySelector('#preview');
    const pdf = document.querySelector('#pdf');
    const selection = document.querySelector('#selection');
    const output = document.querySelector('#pages');
    const sourceSection = document.querySelector('#source-section');
    const status = document.querySelector('#status');
    let previewUrl;
    let dragStart;
    let selectedRect;
    let resultPages = [];

    function drawSelection() {
      const context = selection.getContext('2d');
      context.clearRect(0, 0, selection.width, selection.height);
      if (!selectedRect) return;
      context.fillStyle = 'rgb(180 35 24 / 18%)';
      context.strokeStyle = '#b42318';
      context.lineWidth = 2;
      context.fillRect(selectedRect.x, selectedRect.y, selectedRect.width, selectedRect.height);
      context.strokeRect(selectedRect.x, selectedRect.y, selectedRect.width, selectedRect.height);
    }

    function selectionPoint(event) {
      const bounds = selection.getBoundingClientRect();
      return {
        x: Math.max(0, Math.min(selection.width, (event.clientX - bounds.left) * selection.width / bounds.width)),
        y: Math.max(0, Math.min(selection.height, (event.clientY - bounds.top) * selection.height / bounds.height))
      };
    }

    selection.addEventListener('pointerdown', event => {
      dragStart = selectionPoint(event);
      selectedRect = null;
      selection.setPointerCapture(event.pointerId);
    });
    selection.addEventListener('pointermove', event => {
      if (!dragStart) return;
      const point = selectionPoint(event);
      selectedRect = {
        x: Math.min(dragStart.x, point.x), y: Math.min(dragStart.y, point.y),
        width: Math.abs(point.x - dragStart.x), height: Math.abs(point.y - dragStart.y)
      };
      drawSelection();
    });
    selection.addEventListener('pointerup', () => {
      dragStart = null;
      if (selectedRect?.width < 8 || selectedRect?.height < 8) selectedRect = null;
      drawSelection();
      status.textContent = selectedRect ? 'Region selected. Recognize page will process only this area.' : 'Selection cleared.';
    });

    input.addEventListener('change', async () => {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      const file = input.files[0];
      if (!file) return;
      const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
      selectedRect = null;
      preview.hidden = false;
      selection.hidden = false;
      pdf.hidden = true;
      status.textContent = isPdf ? 'Rendering page 1…' : `${file.name} ready.`;
      if (isPdf) {
        const response = await fetch('http://127.0.0.1:8766/preview', {
          method: 'POST', headers: { 'Content-Type': 'application/pdf' }, body: file
        });
        if (!response.ok) { status.textContent = 'Could not render PDF preview.'; return; }
        previewUrl = URL.createObjectURL(await response.blob());
      } else {
        previewUrl = URL.createObjectURL(file);
      }
      preview.src = previewUrl;
      preview.onload = () => {
        selection.width = preview.naturalWidth;
        selection.height = preview.naturalHeight;
        drawSelection();
        status.textContent = `${file.name} ready. Drag on page 1 to OCR a crop.`;
      };
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const file = input.files[0];
      if (!file) { input.focus(); return; }
      button.disabled = true;
      button.textContent = 'Recognizing…';
      output.textContent = '';
      resultPages = [];
      sourceSection.hidden = false;
      status.textContent = 'Running local inference…';
      const started = performance.now();
      try {
        const selectedMode = geometry.checked ? 'fidelity' : document.querySelector('[name="mode"]:checked').value;
        const endpoint = `http://127.0.0.1:8766/ocr?mode=${selectedMode}&stream=1`;
        let upload = file;
        if (selectedRect && pdf.hidden) {
          const crop = document.createElement('canvas');
          crop.width = Math.round(selectedRect.width);
          crop.height = Math.round(selectedRect.height);
          crop.getContext('2d').drawImage(preview, selectedRect.x, selectedRect.y, selectedRect.width, selectedRect.height, 0, 0, crop.width, crop.height);
          upload = await new Promise(resolve => crop.toBlob(resolve, 'image/png'));
        }
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': upload.type || 'application/octet-stream' },
          body: upload
        });
        if (!response.ok || !response.body) throw new Error(`HTTP ${response.status}`);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const records = buffer.split('\n');
          buffer = records.pop();
          for (const record of records) {
            if (!record) continue;
            const result = JSON.parse(record);
            if (result.type === 'page_start') {
              const page = document.createElement('article');
              page.className = 'ocr-page';
              const visual = document.createElement('div');
              visual.className = 'page-visual';
              const image = document.createElement('img');
              image.src = result.image;
              image.alt = `Page ${result.page}`;
              visual.append(image);
              const copy = document.createElement('div');
              copy.className = 'page-copy';
              copy.innerHTML = `<h3>Page ${result.page} of ${result.pages}</h3><pre></pre>`;
              page.append(visual, copy);
              output.append(page);
              resultPages.push(page);
              sourceSection.hidden = true;
              status.textContent = `Receiving page ${result.page} of ${result.pages}…`;
            } else if (result.type === 'line') {
              const page = resultPages[result.page - 1];
              const text = page.querySelector('pre');
              text.textContent += `${text.textContent ? '\n' : ''}${result.text}`;
              await new Promise(requestAnimationFrame);
            } else if (result.type === 'page_done') {
              status.textContent = `Recognized page ${result.page} of ${result.pages} · ${result.lines} lines`;
            } else if (result.type === 'done') {
              status.textContent = `${result.seconds.toFixed(2)} seconds · ${result.pagesPerSecond.toFixed(2)} pages/sec · ${result.pages} page${result.pages === 1 ? '' : 's'} · ${result.lines} lines`;
            }
          }
          if (done) break;
        }
      } catch (error) {
        status.textContent = `Could not run OCR: ${error.message}. Start the local Kraken service on port 8766.`;
      } finally {
        button.disabled = false;
        button.textContent = 'Recognize page';
      }
    });
  </script>
</body>
</html>
