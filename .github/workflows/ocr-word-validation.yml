name: OCR word geometry validation
on:
  push:
    branches: [fix/retain-ocr-selection-geometry]
    paths: [.github/workflows/ocr-word-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Preserve recognized TSV word boxes and scalar text offsets
        shell: python
        run: |
          from pathlib import Path
          p=Path('legal-pdf-ocr/src/ocr.rs');s=p.read_text()
          old='''            Some(OcrLine {
                          text: words
                              .into_iter()
                              .map(|word| word.text)
                              .collect::<Vec<_>>()
                              .join(" "),'''
          new='''            let mut text = String::new();
                      let mut offset = 0;
                      let recognized_words = words.into_iter().map(|word| {
                          if !text.is_empty() { text.push(' '); offset += 1; }
                          let start = offset;
                          offset += word.text.chars().count();
                          text.push_str(&word.text);
                          legal_pdf_core::OcrWord { text: word.text, bbox: word.bbox, start, end: offset }
                      }).collect();
                      Some(OcrLine {
                          text,'''
          assert old in s;s=s.replace(old,new,1)
          pos=s.index('let recognized_words ='); tail=s[pos:]
          assert 'words: vec![],' in tail
          s=s[:pos]+tail.replace('words: vec![],','words: recognized_words,',1)
          old='        assert_eq!(lines[0].confidence, 0.85);'
          assert old in s
          s=s.replace(old,old+'''
                  assert_eq!(lines[0].words, vec![
                      legal_pdf_core::OcrWord { text: "Hello".into(), bbox: [5.0, 5.0, 20.0, 7.5], start: 0, end: 5 },
                      legal_pdf_core::OcrWord { text: "world".into(), bbox: [22.5, 5.0, 40.0, 7.5], start: 6, end: 11 },
                  ]);''',1)
          p.write_text(s)
      - name: Format touched file and test actual adapter contract
        run: |
          rustfmt --edition 2021 legal-pdf-ocr/src/ocr.rs
          cargo test -p legal-pdf-ocr --lib ocr::tests::tsv_words_become_pdf_coordinate_lines -- --exact
          cargo test -p legal-pdf-support --lib projection::tests::projection_preserves_source_text_and_moves_only_notes_to_page_end -- --exact
          git diff --check
      - name: Publish only the validated producer change
        run: |
          rm .github/workflows/ocr-word-validation.yml
          git add legal-pdf-ocr/src/ocr.rs .github/workflows/ocr-word-validation.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: preserve Tesseract word boxes instead of discarding them'
          git push origin HEAD:fix/retain-ocr-selection-geometry
          git rev-parse HEAD
      - name: Retain source for provider-path inspection
        if: always()
        run: tar -czf /tmp/ocr-provider-source.tar.gz legal-pdf-ocr/src legal-pdf-extraction-processor/src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-provider-source
          path: /tmp/ocr-provider-source.tar.gz
          retention-days: 1
