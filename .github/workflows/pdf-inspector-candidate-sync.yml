name: PDF Inspector candidate sync

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdf-inspector-candidate-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: pdf-inspector
          fetch-depth: 0
          persist-credentials: false
      - name: Merge Firecrawl into candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add firecrawl https://github.com/firecrawl/pdf-inspector.git
          git fetch --no-tags firecrawl main
          git merge --no-edit firecrawl/main
      - name: Advance candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin HEAD:pdf-inspector
