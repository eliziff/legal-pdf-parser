name: PDF Inspector upstream sync

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-inspector-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      parser-sha: ${{ steps.merge.outputs.parser_sha }}
      previous-sha: ${{ steps.merge.outputs.previous_sha }}
      candidate-sha: ${{ steps.merge.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: parser
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: pin
        name: Read the pinned Inspector revision
        shell: bash
        run: |
          sha="$(sed -n 's/.*pdf-inspector = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' parser/Cargo.toml)"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: inspector
          ref: ${{ steps.pin.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: merge
        name: Squash upstream onto the pinned revision
        shell: bash
        run: |
          set -euo pipefail
          parser_sha="$(git -C parser rev-parse HEAD)"
          previous_sha="$(git -C inspector rev-parse HEAD)"
          pinned_sha="$previous_sha"
          # Upstream objects stay on this runner; only the squashed candidate is bundled.
          upstream=https://github.com/firecrawl/pdf-inspector.git
          git -C inspector fetch --no-tags "$upstream" main
          upstream_sha="$(git -C inspector rev-parse FETCH_HEAD)"
          base_sha="$(sed -n 's/^commit //p' inspector/.upstream-pdf-inspector)"
          git -C inspector cat-file -e "$base_sha^{commit}" || git -C inspector fetch --no-tags "$upstream" "$base_sha"
          echo "parser_sha=$parser_sha" >> "$GITHUB_OUTPUT"
          echo "previous_sha=$previous_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          git -C inspector config user.name github-actions[bot]
          git -C inspector config user.email 41898282+github-actions[bot]@users.noreply.github.com
          report="$RUNNER_TEMP/sync-report.md"
          if ! bash parser/tools/merge-pdf-inspector.sh inspector "$upstream_sha" parser/docs/pdf-inspector-agent-guide.md "$report"; then
            if test -s "$report"; then echo "report=true" >> "$GITHUB_OUTPUT"; fi
            exit 1
          fi
          candidate_sha="$(git -C inspector rev-parse HEAD)"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          if test "$candidate_sha" = "$pinned_sha"; then
            echo "Up to date: pdf-inspector ${candidate_sha:0:12} incorporates upstream ${upstream_sha:0:12} and is pinned." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Gating pdf-inspector ${candidate_sha:0:12} (upstream ${upstream_sha:0:12}); the parser pins ${pinned_sha:0:12}." >> "$GITHUB_STEP_SUMMARY"
          git -C inspector tag pdf-inspector-candidate "$candidate_sha"
          git -C inspector bundle create ../pdf-inspector.bundle refs/tags/pdf-inspector-candidate
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Report the blocked sync
        if: failure() && steps.merge.outputs.report == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title='PDF Inspector upstream sync needs resolution'
          body="$RUNNER_TEMP/issue.md"
          { echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo; echo '```'; cat "$RUNNER_TEMP/sync-report.md"; echo '```'; } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if test -n "$issue"; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.merge.outputs.changed == 'true'
        with:
          name: pdf-inspector-candidate
          path: pdf-inspector.bundle
          compression-level: 0
          retention-days: 1

  gate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/pdf-inspector-gate.yml
    with:
      parser-ref: ${{ needs.prepare.outputs.parser-sha }}
      candidate-artifact: pdf-inspector-candidate
      candidate-sha: ${{ needs.prepare.outputs.candidate-sha }}

  publish:
    needs: [prepare, gate]
    if: needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: parser
          ref: ${{ needs.prepare.outputs.parser-sha }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: inspector
          ref: ${{ needs.prepare.outputs.previous-sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pdf-inspector-candidate
      - name: Publish the accepted revision
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate-sha }}
          PREVIOUS_SHA: ${{ needs.prepare.outputs.previous-sha }}
        run: |
          set -euo pipefail
          git -C inspector fetch ../pdf-inspector.bundle refs/tags/pdf-inspector-candidate
          test "$(git -C inspector rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          # Only single-parent squash commits extend the Inspector lineage; upstream history never does.
          if test "$CANDIDATE_SHA" != "$PREVIOUS_SHA"; then
            test "$(git -C inspector rev-parse "$CANDIDATE_SHA^@")" = "$PREVIOUS_SHA"
          fi
          git -C inspector push origin "FETCH_HEAD:refs/tags/pdf-inspector-$CANDIDATE_SHA"
      - name: Update main to the exact gated parser pin
        working-directory: parser
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate-sha }}
          PARSER_SHA: ${{ needs.prepare.outputs.parser-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The gate accepted this exact parser revision; a moved branch is regated next run.
          if test "$(git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)" != "$PARSER_SHA"; then
            echo "::notice::$DEFAULT_BRANCH moved after gating; the next sync gates the new combination."
            exit 0
          fi
          short_sha="${CANDIDATE_SHA:0:12}"
          previous_sha="${{ needs.prepare.outputs.previous-sha }}"
          sed -i "s/rev = \"$previous_sha\"/rev = \"$CANDIDATE_SHA\"/" Cargo.toml
          git clone --branch main --single-branch --depth 1 https://github.com/eliziff/common-law-cite.git ../common-law-cite
          git clone --branch main --single-branch --depth 1 https://github.com/eliziff/legal-structure-parser.git ../legal-structure
          cargo update -p pdf-inspector
          grep -Fq "legal-pdf-parser.git?rev=$CANDIDATE_SHA#$CANDIDATE_SHA" Cargo.lock
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = Cargo.lock
          test "${changed[1]}" = Cargo.toml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock
          git commit -m "Pin PDF Inspector to $short_sha"
          # A regular push refuses a moved main; its new combination must be regated.
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          echo "Pinned pdf-inspector $short_sha on $DEFAULT_BRANCH." >> "$GITHUB_STEP_SUMMARY"
