name: PDF Inspector auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  schedule:
    if: >-
      github.actor == 'dependabot[bot]' &&
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.title, 'pdf-inspector')
    runs-on: ubuntu-latest
    steps:
      - name: Verify lockfile-only update
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          changed="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[].filename')"
          if [ "$changed" != "Cargo.lock" ]; then
            echo "Expected exactly Cargo.lock; got:"
            printf '%s\n' "$changed"
            exit 1
          fi
      - name: Enable auto-merge after required checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge --repo "$GITHUB_REPOSITORY" "$PR" --auto --merge
