name: Line-only OCR selection validation
on:
  push:
    branches: [fix/retain-ocr-selection-geometry]
    paths: [.github/workflows/ocr-line-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Retain the real line text when the provider has no word boxes
        shell: python
        run: |
          from pathlib import Path
          p=Path('legal-pdf-support/src/projection.rs');s=p.read_text()
          old='pub struct PdfTextLine {\n    pub id: String,'
          assert old in s
          s=s.replace(old,'pub struct PdfTextLine {\n    pub id: String,\n    #[serde(default, skip_serializing_if = "String::is_empty")]\n    pub text: String,',1)
          old='''                    .map(|line| PdfTextLine {
                                  id: line.id.clone(),'''
          assert old in s
          s=s.replace(old,old+'''
                                  text: if line.words.is_empty() { line.text.clone() } else { String::new() },''',1)
          old='        assert_eq!(page.lines[0].words[0].text, "Recognized");'
          assert old in s
          s=s.replace(old,old+'''
                  assert!(page.lines[0].text.is_empty());
                  assert_eq!(page.lines[1].text, "Unclassified source text");
                  assert!(page.lines[1].words.is_empty());''',1)
          p.write_text(s)
      - name: Validate retained line and word geometry
        run: |
          rustfmt --edition 2021 legal-pdf-support/src/projection.rs
          cargo test -p legal-pdf-support --lib projection::tests::projection_preserves_source_text_and_moves_only_notes_to_page_end -- --exact
          cargo test -p legal-pdf-ocr --lib ocr::tests::tsv_words_become_pdf_coordinate_lines -- --exact
          git diff --check
      - name: Publish only the validated source change
        run: |
          rm .github/workflows/ocr-line-validation.yml
          git add legal-pdf-support/src/projection.rs .github/workflows/ocr-line-validation.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: retain selectable text for line-only OCR providers'
          git push origin HEAD:fix/retain-ocr-selection-geometry
          git rev-parse HEAD
