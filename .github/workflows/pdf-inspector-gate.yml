name: PDF Inspector preflight

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "legal-pdf-*/**"
      - "rust/src/**"
      - "experiments/cache-contract-fidelity/**"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Open-Legal-Products/mike
          ref: 7411b1be11f9e15452fd3ab21d19354cc0a864a4
          path: work
          sparse-checkout: legal-structure
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: work/legal-pdf-parser
          persist-credentials: false
      - name: Check parser
        working-directory: work/legal-pdf-parser
        run: cargo check --locked --no-default-features --features pdf,language

  source-document-preflight:
    runs-on: [self-hosted, Windows, X64, legalpdf-corpus-ephemeral]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Open-Legal-Products/mike
          ref: 7411b1be11f9e15452fd3ab21d19354cc0a864a4
          path: shared
          sparse-checkout: legal-structure
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: base/legal-pdf-parser
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: head/legal-pdf-parser
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Copy pinned legal-structure
        shell: pwsh
        run: |
          Copy-Item shared/legal-structure base/legal-structure -Recurse
          Copy-Item shared/legal-structure head/legal-structure -Recurse
      - name: Build and compare source documents
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP legalpdf-upstream-target
          $baseBinary = Join-Path $env:RUNNER_TEMP legalpdf-base.exe
          $headBinary = Join-Path $env:RUNNER_TEMP legalpdf-head.exe
          $env:CARGO_TARGET_DIR = $target

          cargo build --manifest-path base/legal-pdf-parser/Cargo.toml --locked --no-default-features --features pdf,language --bin legalpdf
          Copy-Item (Join-Path $target debug/legalpdf.exe) $baseBinary
          cargo build --manifest-path head/legal-pdf-parser/Cargo.toml --locked --no-default-features --features pdf,language --bin legalpdf
          Copy-Item (Join-Path $target debug/legalpdf.exe) $headBinary

          python base/legal-pdf-parser/experiments/cache-contract-fidelity/harness.py --source-doc-only --binary $baseBinary --corpus-root '${{ vars.LEGALPDF_CORPUS_ROOT }}' --raw (Join-Path $env:RUNNER_TEMP legalpdf-base-raw)
          python base/legal-pdf-parser/experiments/cache-contract-fidelity/harness.py --source-doc-only --binary $headBinary --corpus-root '${{ vars.LEGALPDF_CORPUS_ROOT }}' --raw (Join-Path $env:RUNNER_TEMP legalpdf-head-raw)

          $baseReports = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP legalpdf-base-raw) -Filter report.json -Recurse)
          $headReports = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP legalpdf-head-raw) -Filter report.json -Recurse)
          if ($baseReports.Count -ne 1) { throw "Expected exactly one base report, found $($baseReports.Count)" }
          if ($headReports.Count -ne 1) { throw "Expected exactly one head report, found $($headReports.Count)" }
          $base = $baseReports[0]
          $head = $headReports[0]
          $baseHash = (Get-Content -Raw $base.FullName | ConvertFrom-Json).source_docs_sha256
          $headHash = (Get-Content -Raw $head.FullName | ConvertFrom-Json).source_docs_sha256
          if ($baseHash -ne $headHash) { throw "SourceDoc parity failed: $baseHash != $headHash" }
          "SourceDoc parity: $headHash"
