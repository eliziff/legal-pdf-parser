name: PDF Inspector preflight

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "legal-pdf-*/**"
      - "rust/src/**"
      - "experiments/cache-contract-fidelity/**"
      - ".github/workflows/pdf-inspector-*.yml"
      - "AGENTS.md"
      - "docs/pdf-inspector-agent-guide.md"
      - "tools/*merge-pdf-inspector.sh"
  workflow_call:
    inputs:
      parser-ref:
        required: true
        type: string
      candidate-artifact:
        required: true
        type: string
      candidate-sha:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  source-document-preflight:
    if: >-
      inputs.candidate-sha != '' || github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eliziff/Beaver
          ref: bebcff314d348932d149e3ef1f2b2fb77c797b2a
          path: corpus
          sparse-checkout: |
            benchmarks/legal-generalization-corpus/gold/maud-v1/MAUD_v1_README.pdf
            benchmarks/legal-generalization-corpus/raw/ca-case-2014-scc-bhasin-v-hrynew.pdf
            benchmarks/legal-generalization-corpus/raw/ca-case-2021-scc-wastech-services.pdf
            benchmarks/legal-generalization-corpus/raw/us-complaint-2020-sec-honig.pdf
            benchmarks/legal-generalization-corpus/raw/us-complaint-2023-sec-comp25666.pdf
            benchmarks/legal-generalization-corpus/raw/us-court-opinion-ilnd-05-cv-03198.pdf
            benchmarks/legal-generalization-corpus/raw/us-court-opinion-txsd-10-cv-04728.pdf
            benchmarks/legal-generalization-corpus/raw/us-court-opinion-txsd-16-cv-01947-westport.pdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.candidate-sha == ''
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.candidate-sha == ''
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.candidate-sha != ''
        with:
          path: base
          ref: ${{ inputs.parser-ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.candidate-sha != ''
        with:
          path: head
          ref: ${{ inputs.parser-ref }}
          persist-credentials: false
      - name: Verify fork guidance survives upstream merges
        shell: bash
        run: bash head/tools/test-merge-pdf-inspector.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.candidate-sha != ''
        with:
          name: ${{ inputs.candidate-artifact }}
          path: candidate
      - name: Use candidate PDF Inspector
        if: inputs.candidate-sha != ''
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
        run: |
          git clone --no-checkout candidate/pdf-inspector.bundle inspector
          git -C inspector checkout --detach $env:CANDIDATE_SHA
          if ((git -C inspector rev-parse HEAD) -ne $env:CANDIDATE_SHA) {
            throw "Candidate bundle does not contain $env:CANDIDATE_SHA"
          }

          $manifest = Join-Path $env:GITHUB_WORKSPACE 'head/Cargo.toml'
          $source = [System.IO.File]::ReadAllText($manifest)
          $dependency = 'pdf-inspector = { git = "https://github.com/eliziff/legal-pdf-parser.git", branch = "pdf-inspector", default-features = false }'
          if (-not $source.Contains($dependency)) { throw "PDF Inspector dependency declaration changed" }
          [System.IO.File]::WriteAllText(
            $manifest,
            $source.Replace($dependency, 'pdf-inspector = { path = "../inspector", default-features = false }')
          )
          cargo update --manifest-path $manifest -p pdf-inspector
          if ($LASTEXITCODE -ne 0) { throw "Candidate lockfile update failed" }
      - name: Build and compare raw-PDF products
        shell: pwsh
        run: |
          $env:LEGALPDF_CORPUS_ROOT = Join-Path $env:GITHUB_WORKSPACE 'corpus'
          $target = Join-Path $env:RUNNER_TEMP legalpdf-pdf-inspector-target
          $baseBinary = Join-Path $env:RUNNER_TEMP legalpdf-base.exe
          $headBinary = Join-Path $env:RUNNER_TEMP legalpdf-head.exe
          $baseSnapshot = Join-Path $env:RUNNER_TEMP legalpdf-base-products.jsonl
          $headSnapshot = Join-Path $env:RUNNER_TEMP legalpdf-head-products.jsonl
          $baseManifest = Join-Path $env:GITHUB_WORKSPACE 'base/Cargo.toml'
          $headManifest = Join-Path $env:GITHUB_WORKSPACE 'head/Cargo.toml'
          $gateManifest = Join-Path $env:GITHUB_WORKSPACE 'head/experiments/cache-contract-fidelity/manifest.json'
          $env:CARGO_TARGET_DIR = $target

          cargo build --manifest-path $baseManifest --locked --no-default-features --features pdf --bin legalpdf
          if ($LASTEXITCODE -ne 0) { throw "Base legalpdf build failed" }
          Copy-Item (Join-Path $target debug/legalpdf.exe) $baseBinary
          cargo build --manifest-path $headManifest --locked --no-default-features --features pdf --bin legalpdf
          if ($LASTEXITCODE -ne 0) { throw "Head legalpdf build failed" }
          Copy-Item (Join-Path $target debug/legalpdf.exe) $headBinary

          & $baseBinary _pdf-inspector-gate $gateManifest $env:LEGALPDF_CORPUS_ROOT > $baseSnapshot
          if ($LASTEXITCODE -ne 0) { throw "Base PDF Inspector product gate failed" }
          & $headBinary _pdf-inspector-gate $gateManifest $env:LEGALPDF_CORPUS_ROOT > $headSnapshot
          if ($LASTEXITCODE -ne 0) { throw "Head PDF Inspector product gate failed" }

          $baseHash = (Get-FileHash -Algorithm SHA256 $baseSnapshot).Hash.ToLowerInvariant()
          $headHash = (Get-FileHash -Algorithm SHA256 $headSnapshot).Hash.ToLowerInvariant()
          if ($baseHash -ne $headHash) {
            throw "PDF Inspector product parity failed: $baseHash != $headHash"
          }
          "PDF Inspector product parity: $headHash"
