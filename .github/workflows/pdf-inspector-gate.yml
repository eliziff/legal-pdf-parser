name: PDF Inspector preflight

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "legal-pdf-*/**"
      - "rust/src/**"
      - "experiments/cache-contract-fidelity/**"
      - ".github/workflows/pdf-inspector-*.yml"
      - "AGENTS.md"
      - "docs/pdf-inspector-agent-guide.md"
      - "tools/*merge-pdf-inspector.sh"
      - "tools/check-pdf-source-gold.py"
      - "tools/pdf-inspector-regression.json"
  pull_request:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "legal-pdf-*/**"
      - "rust/src/**"
      - "experiments/cache-contract-fidelity/**"
      - ".github/workflows/pdf-inspector-*.yml"
      - "AGENTS.md"
      - "docs/pdf-inspector-agent-guide.md"
      - "tools/*merge-pdf-inspector.sh"
      - "tools/check-pdf-source-gold.py"
      - "tools/pdf-inspector-regression.json"
  workflow_call:
    inputs:
      parser-ref:
        required: true
        type: string
      candidate-artifact:
        required: true
        type: string
      candidate-sha:
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: pdf-inspector-preflight-${{ github.ref }}-${{ inputs.candidate-sha }}
  cancel-in-progress: true

jobs:
  guidance-and-scope:
    runs-on: ubuntu-latest
    outputs:
      parser: ${{ steps.scope.outputs.parser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.parser-ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify fork guidance survives upstream merges
        run: bash tools/test-merge-pdf-inspector.sh
      - id: scope
        name: Reserve source-document preflight for engine inputs
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
        shell: python
        run: |
          import json, os, subprocess
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          if os.environ.get('CANDIDATE_SHA'):
              parser = True
          else:
              pr = event.get('pull_request')
              before = pr['base']['sha'] if pr else event.get('before', '')
              after = pr['head']['sha'] if pr else event.get('after', '')
              comparison = before + ('...' if pr else '..') + after
              diff = subprocess.run(['git', 'diff', '--name-only', '--no-renames', '-z', comparison],
                                    capture_output=True)
              paths = diff.stdout.decode().strip('\0').split('\0') if diff.stdout else []
              parser = diff.returncode != 0 or any(
                  path and not path.endswith('.md') and not path.startswith('docs/')
                  and path != 'tools/test-merge-pdf-inspector.sh' for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('parser=' + str(parser).lower() + '\n')

  source-document-preflight:
    needs: guidance-and-scope
    if: >-
      needs.guidance-and-scope.outputs.parser == 'true' &&
      (inputs.candidate-sha != '' || github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eliziff/Beaver
          ref: bebcff314d348932d149e3ef1f2b2fb77c797b2a
          path: corpus
          sparse-checkout: |
            benchmarks/legal-generalization-corpus/gold/maud-v1/MAUD_v1_README.pdf
            benchmarks/legal-generalization-corpus/raw/ca-case-2014-scc-bhasin-v-hrynew.pdf
            benchmarks/legal-generalization-corpus/raw/ca-case-2021-scc-wastech-services.pdf
            benchmarks/legal-generalization-corpus/raw/us-complaint-2020-sec-honig.pdf
            benchmarks/legal-generalization-corpus/raw/us-complaint-2023-sec-comp25666.pdf
            benchmarks/legal-generalization-corpus/raw/us-court-opinion-ilnd-05-cv-03198.pdf
            benchmarks/legal-generalization-corpus/raw/us-court-opinion-txsd-10-cv-04728.pdf
            benchmarks/legal-generalization-corpus/raw/us-court-opinion-txsd-16-cv-01947-westport.pdf
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          ref: ${{ inputs.parser-ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: First-party source checkouts
        shell: bash
        run: |
          git clone --branch main --single-branch --depth 1 https://github.com/eliziff/common-law-cite.git common-law-cite
          git clone --branch main --single-branch --depth 1 https://github.com/eliziff/legal-structure-parser.git legal-structure
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.candidate-sha != ''
        with:
          name: ${{ inputs.candidate-artifact }}
          path: candidate
      - name: Use candidate PDF Inspector
        if: inputs.candidate-sha != ''
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
        run: |
          git clone --no-checkout candidate/pdf-inspector.bundle inspector
          git -C inspector checkout --detach $env:CANDIDATE_SHA
          if ((git -C inspector rev-parse HEAD) -ne $env:CANDIDATE_SHA) {
            throw "Candidate bundle does not contain $env:CANDIDATE_SHA"
          }

          $manifest = Join-Path $env:GITHUB_WORKSPACE 'head/Cargo.toml'
          $source = [System.IO.File]::ReadAllText($manifest)
          $dependency = 'pdf-inspector = \{ git = "https://github.com/eliziff/legal-pdf-parser\.git", rev = "[0-9a-f]{40}", default-features = false \}'
          if (-not [regex]::IsMatch($source, $dependency)) { throw "PDF Inspector dependency declaration changed" }
          [System.IO.File]::WriteAllText(
            $manifest,
            [regex]::Replace($source, $dependency, 'pdf-inspector = { path = "../inspector", default-features = false }')
          )
          cargo update --manifest-path $manifest -p pdf-inspector
          if ($LASTEXITCODE -ne 0) { throw "Candidate lockfile update failed" }
      - name: Check candidate against frozen products and source gold
        shell: pwsh
        run: |
          $env:LEGALPDF_CORPUS_ROOT = Join-Path $env:GITHUB_WORKSPACE 'corpus'
          $target = Join-Path $env:RUNNER_TEMP legalpdf-pdf-inspector-target
          $headSnapshot = Join-Path $env:RUNNER_TEMP legalpdf-head-products.jsonl
          $headManifest = Join-Path $env:GITHUB_WORKSPACE 'head/Cargo.toml'
          $manifest = Get-Content head/experiments/cache-contract-fidelity/manifest.json -Raw | ConvertFrom-Json
          $regression = Get-Content head/tools/pdf-inspector-regression.json -Raw | ConvertFrom-Json
          foreach ($source in $regression.additional_sources) {
            $destination = Join-Path $env:LEGALPDF_CORPUS_ROOT $source.path
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Invoke-WebRequest -Uri $source.url -OutFile $destination -UserAgent 'Mozilla/5.0' -TimeoutSec 60
            $manifest.documents += $source | Select-Object path, sha256, pages
          }
          $gateManifest = Join-Path $env:RUNNER_TEMP legalpdf-source-manifest.json
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $gateManifest
          $env:CARGO_TARGET_DIR = $target

          cargo build --manifest-path $headManifest --locked --no-default-features --features pdf --bin legalpdf
          if ($LASTEXITCODE -ne 0) { throw "Candidate legalpdf build failed" }
          & (Join-Path $target debug/legalpdf.exe) _pdf-inspector-gate $gateManifest $env:LEGALPDF_CORPUS_ROOT > $headSnapshot
          if ($LASTEXITCODE -ne 0) { throw "Candidate PDF Inspector product gate failed" }
          python head/tools/check-pdf-source-gold.py $headSnapshot head/tools/pdf-inspector-regression.json
          if ($LASTEXITCODE -ne 0) { throw "PDF source gold or frozen regression check failed" }
