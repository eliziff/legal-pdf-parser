[package]
name = "legal-structure-store"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
a2aj = ["legal-structure/a2aj"]

[dependencies]
legal-structure = { path = "../legal-structure", features = ["source-doc"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[[bin]]
name = "legal-structure-store"
path = "src/main.rs"
required-features = ["a2aj"]
