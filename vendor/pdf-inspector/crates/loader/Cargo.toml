[package]
name = "pdf-inspector-loader"
version = "1.14.0"
edition = "2021"
license = "MIT"

[dependencies]
log = "0.4"
thiserror = "2.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { version = "0.42.0", default-features = false, features = ["rayon"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { version = "0.42.0", default-features = false, features = ["wasm_js"] }
