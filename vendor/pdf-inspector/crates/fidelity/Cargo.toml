[package]
name = "pdf-inspector-fidelity"
version = "1.14.0"
edition = "2021"
license = "MIT"

[dependencies]
log = "0.4"
pdf-inspector-core = { path = "../core" }
pdf-inspector-detector = { path = "../detector" }
pdf-inspector-fonts = { path = "../fonts" }
pdf-inspector-layout = { path = "../layout" }
pdf-inspector-loader = { path = "../loader" }
pdf-inspector-tables = { path = "../tables" }
ttf-parser = "0.25"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { version = "0.42.0", default-features = false, features = ["rayon"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { version = "0.42.0", default-features = false, features = ["wasm_js"] }
