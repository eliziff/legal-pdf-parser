[package]
name = "legal-structure"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
structure-inference = ["dep:legal-grammar-tables"]
source-doc = []
a2aj = ["structure-inference", "source-doc"]
journal = ["source-doc"]

[dependencies]
aho-corasick = "1.1"
legal-grammar-tables = { path = "../legal-grammar-tables", optional = true }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
unicode-normalization = "0.1"
