[package]
name = "legal-structure"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
recovery = ["dep:regex"]

[dependencies]
regex = { version = "1.11", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[[bin]]
name = "legal-structure"
path = "src/main.rs"
required-features = ["recovery"]

[[bin]]
name = "legal-structure-native"
path = "src/native_main.rs"
