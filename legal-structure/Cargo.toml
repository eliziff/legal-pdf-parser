[package]
name = "legal-structure"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = []
structure-inference = []
source-doc = []
a2aj = ["structure-inference", "source-doc"]
journal = ["source-doc"]

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"

[[bin]]
name = "legal-structure"
path = "src/main.rs"
required-features = ["structure-inference"]

[[bin]]
name = "legal-structure-native"
path = "src/native_main.rs"
