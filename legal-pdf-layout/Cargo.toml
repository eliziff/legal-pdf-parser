[package]
name = "legal-pdf-layout"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A PDF page's layout as the structure stage reads it: regions, columns, tables, reading order and language"

[dependencies]
legal-pdf-core = { path = "../legal-pdf-core" }
legal-pdf-structure-model = { path = "../legal-pdf-structure-model" }
legal-pdf-tables = { path = "../legal-pdf-tables" }
legal-structure-model = { workspace = true }
pdf-inspector = { workspace = true }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
