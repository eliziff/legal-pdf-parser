[package]
name = "legal-pdf-witnesses"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Every body line's witnesses, read against its page and its document, and the decisions composed over them"

[dependencies]
legal-pdf-core = { path = "../legal-pdf-core" }
legal-structure-model = { workspace = true }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
legal-pdf-core = { path = "../legal-pdf-core", features = ["structure-analysis"] }
