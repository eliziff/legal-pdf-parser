[package]
name = "legal-pdf-language"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
# The TypeScript declaration of what it returns the engine (native/legal-structure-node's export-types).
binding-types = ["dep:ts-rs"]

[dependencies]
legal-pdf-core = { path = "../legal-pdf-core" }
ts-rs = { version = "12", optional = true }
legal-structure-model = { workspace = true }
quick-xml = "0.42"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Unit tests run the structure engine, which programs supply at run time.
[dev-dependencies]
legal-pdf-core = { path = "../legal-pdf-core", features = ["structure-analysis"] }
