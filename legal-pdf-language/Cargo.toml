[package]
name = "legal-pdf-language"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
legal-pdf-core = { path = "../legal-pdf-core" }
legal-structure = { workspace = true, features = ["structure-inference"] }
quick-xml = "0.41"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zip = { version = "=8.2.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
