[package]
name = "legal-pdf-language"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
# The TypeScript declaration of what it returns the engine (native/legal-structure-node's export-types).
binding-types = ["dep:ts-rs"]

[dependencies]
thiserror = "2.0"
ts-rs = { version = "12", optional = true }
legal-structure-model = { workspace = true }
legal-structure = { workspace = true, features = ["structure-inference"] }
# A tracked change's time (src/docx_spans.rs).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Word's sort of a table of authorities (ICU's root collation, as Intl.Collator sorts the book).
icu_collator = "2.1"
# The minimal changes an assistant's edit makes (src/docx_tracked.rs).
diff-match-patch-rs = { path = "../../common-law-cite/crates/legal-citations/vendor/diff-match-patch-rs" }
# The text ops' lookarounds and spelling (src/text_ops.rs).
fancy-regex = "0.19"
spellbook = "0.4"
quick-xml = "0.42"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

